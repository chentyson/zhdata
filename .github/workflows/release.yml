name: release

# v2rayN core updates are GitHub Releases whose tag matches v*.*.*
# and whose assets are exactly zhdata-<os>-<arch>.zip (amd64 -> 64).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Build and package six release zips
        run: bash release.sh

      - name: Verify zip layout (single top-level zhdata/ dir)
        run: |
          set -euo pipefail
          for f in dist/release/zhdata-*.zip; do
            echo "== $f"
            python3 -m zipfile -l "$f"
          done

      - name: Verify version output has semver
        run: |
          set -euo pipefail
          out="$(./dist/zhdata-linux-amd64 -version 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -Eq '[0-9]+\.[0-9]+\.[0-9]+' || { echo "no semver in -version output" >&2; exit 1; }

      - name: Upload release assets
        uses: softprops/action-gh-release@v3.0.4
        with:
          fail_on_unmatched_files: true
          make_latest: "true"
          files: |
            dist/release/zhdata-windows-64.zip
            dist/release/zhdata-windows-arm64.zip
            dist/release/zhdata-linux-64.zip
            dist/release/zhdata-linux-arm64.zip
            dist/release/zhdata-macos-64.zip
            dist/release/zhdata-macos-arm64.zip
